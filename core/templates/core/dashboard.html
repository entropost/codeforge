{% extends 'core/base.html' %}

{% block content %}
<h1>Dashboard</h1>

<div style="display: flex; gap: 20px; margin-bottom: 30px;">
    <div class="problem-card" style="flex: 1; text-align: center;">
        <h3>Total Problems</h3>
        <p style="font-size: 2em; margin: 0;">{{ total_problems }}</p>
    </div>
    <div class="problem-card" style="flex: 1; text-align: center;">
        <h3>Due Today</h3>
        <p style="font-size: 2em; margin: 0; color: #dc3545;">{{ due_today }}</p>
    </div>
    <div class="problem-card" style="flex: 1; text-align: center;">
        <h3>Total Reviews</h3>
        <p style="font-size: 2em;">{{ total_reviews }}</p>
    </div>
</div>
{% endblock %}
