{% extends 'core/base.html' %}

{% block content %}
<h2>Edit Course: {{ course.name }}</h2>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn">Save Changes</button>
    <a href="{% url 'course_detail' course.id %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
